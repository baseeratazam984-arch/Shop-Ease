<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Checkout</title>
</head>

<body>

    <div class="checkout-page" id="checkout-page">

        <div class="checkout-header" id="checkout-header">
            <h1>Checkout</h1>
            <a href="cart.html" id="back-to-cart">Back to Cart</a>
        </div>

        <div class="checkout-container" id="checkout-container">

            <div class="checkout-form" id="checkout-form-container">

                <fieldset class="field" id="delivery-field">

                    <h2>Delivery Information</h2>

                    <form id="checkoutForm">

                        <div class="form-group" id="full-name-group">
                            <label for="fullName">Full Name</label>
                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                                required
                            >
                        </div>

                        <div class="form-group" id="phone-group">
                            <label for="phone">Phone Number</label>
                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter your phone number"
                                required
                            >
                        </div>

                        <div class="form-group" id="address-group">
                            <label for="address">Address</label>
                            <textarea
                                id="address"
                                placeholder="Enter your complete address"
                                required
                            ></textarea>
                        </div>

                        <div class="form-group" id="city-group">
                            <label for="city">City</label>
                            <input
                                type="text"
                                id="city"
                                placeholder="Enter your city"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            id="place-order-btn"
                            class="place-order-btn"
                        >
                            Place Order
                        </button>

                    </form>

                </fieldset>

            </div>

            <div class="checkout-summary" id="checkout-summary">

                <h2>Order Summary</h2>

                <div id="checkout-items">
                </div>

                <div class="summary-row" id="checkout-subtotal-row">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">$0.00</span>
                </div>

                <div class="summary-row" id="checkout-shipping-row">
                    <span>Shipping</span>
                    <span id="checkout-shipping">$5.00</span>
                </div>

                <hr>

                <div class="summary-total" id="checkout-total-row">
                    <span>Total</span>
                    <strong id="checkout-total">$0.00</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="./script.js"></script>

</body>

</html>
