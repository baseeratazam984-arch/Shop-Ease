<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>login</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Welcome Back</h1>
            <p>Login to continue shopping</p>
            <form id="loginForm">
                <input type="email" name="" id="loginEmail" placeholder="Enter your email" required>
                <input type="password" name="" id="loginpassword" placeholder="Enter your password" required>
                <button type="submit">Login</button>
            </form>
            <p class="auth-link">D'ont have an account?<a href="signup.html">Sign up</a></p>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
