<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>signup</title>
</head>
<body>
    <div class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p>Sign up ton start shopping</p>

            <form id="signupForm">
                
                <input type="text" name="" id="signupName" placeholder="Full Name" required>
                <input type="email" name="" id="signupEmail" placeholder="Email" required>
                <input type="password" name="" id="signupPassword" placeholder="Password" required>
                <input type="password" name="" id="confirmPassword" placeholder="Confirm Password" required>
                <button type="submit">Create Account</button>
            </form>
            <p class="auth-link">Already have an account?<a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
